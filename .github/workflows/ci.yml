name: BedrockData validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Validate Composer package manifest
        run: composer validate --no-check-publish --no-interaction
      - name: Verify Composer dependency installation
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Validate JSON assets and essential Bedrock NBT files
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("composer.json").read_text(encoding="utf-8"))
          assert manifest["type"] == "library"
          assert manifest["license"] == "CC0-1.0"

          data_files = list(Path(".").rglob("*.json"))
          assert len(data_files) > 20, "Unexpectedly small BedrockData JSON asset set"
          for path in data_files:
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except (ValueError, UnicodeError) as exc:
                  raise AssertionError(f"Invalid JSON asset {path}: {exc}") from exc

          essentials = [
              "canonical_block_states.nbt",
              "biome_definitions.nbt",
              "item_registry.json",
              "required_item_list.json",
              "protocol_info.json",
          ]
          for name in essentials:
              path = Path(name)
              assert path.is_file() and path.stat().st_size > 100, f"Missing or empty Bedrock data asset: {name}"

          print(f"Validated {len(data_files)} JSON files and {len(essentials)} required assets")
          PY
      - name: Verify paired 1.26.60 assets and import provenance
        run: python3 tools/validate-12660.py

  publish:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish tested Composer prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v1.0.0-beta.2
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag already published; not replacing it."
            exit 0
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title 'BedrockData 1.0.0-beta.2 · versioned 1.26.60 assets' --notes-file RELEASE-beta2.md
